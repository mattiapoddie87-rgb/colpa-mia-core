<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento completato — COLPA MIA</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0b1020; color:#e9ecff; }
    .wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 28px 18px; }
    .box { width: min(720px, 100%); text-align:center; }
    h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -0.02em; }
    p { margin: 0 0 18px; color: rgba(233,236,255,0.82); }
    .spinner {
      width: 42px; height: 42px; border-radius: 999px;
      border: 4px solid rgba(233,236,255,0.18);
      border-top-color: #7c3aed;
      margin: 18px auto;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { margin-top: 10px; font-size: 14px; }
    .ok { color: #86efac; }
    .err { color: #fecaca; }
    a { color: #7c3aed; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .btn { display:inline-block; margin-top: 14px; padding: 10px 14px; border-radius: 12px; background:#151a2e; border:1px solid rgba(255,255,255,0.10); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <h1>Pagamento completato</h1>
      <p>Stiamo generando e inviando la tua scusa all’indirizzo indicato.</p>
      <div class="spinner" id="spin"></div>
      <div class="status" id="status">Invio in corso…</div>
      <div class="btn"><a href="index.html">← Torna al catalogo</a></div>
    </div>
  </div>

<script>
  const statusEl = document.getElementById("status");
  const spinEl = document.getElementById("spin");

  function getSessionId() {
    const url = new URL(window.location.href);
    return url.searchParams.get("session_id") || "";
  }

  async function sendEmail(sessionId) {
    // CHIAMATA GET (compatibile con session-email.js aggiornato)
    const res = await fetch(`/.netlify/functions/session-email?session_id=${encodeURIComponent(sessionId)}`, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    let data = {};
    try { data = await res.json(); } catch (_) { data = {}; }

    if (!res.ok) {
      const msg = data && data.error ? data.error : `Errore invio (HTTP ${res.status})`;
      throw new Error(msg);
    }
    return data;
  }

  (async () => {
    const sessionId = getSessionId();
    if (!sessionId) {
      spinEl.style.display = "none";
      statusEl.className = "status err";
      statusEl.textContent = "Errore: session_id mancante nell’URL.";
      return;
    }

    try {
      const out = await sendEmail(sessionId);
      spinEl.style.display = "none";
      statusEl.className = "status ok";
      statusEl.textContent = "Scusa inviata via email con successo.";
      // opzionale: console.log(out);
    } catch (e) {
      spinEl.style.display = "none";
      statusEl.className = "status err";
      statusEl.textContent = e.message || String(e);
    }
  })();
</script>
</body>
</html>
