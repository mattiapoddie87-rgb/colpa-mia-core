<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    background: #0b1020;
    color: #e9ecff;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 18px;
  }

  h1 {
    font-size: 34px;
    margin-bottom: 12px;
  }

  p {
    opacity: 0.85;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 22px;
    margin-top: 32px;
  }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .25s ease, box-shadow .25s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(0,0,0,.35);
  }

  /* ========= IMMAGINI PACCHETTI ========= */

  .card-media {
    height: 170px;
    background-size: cover;
    background-position: center;
    position: relative;
  }

  .card-media::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.15),
      rgba(0,0,0,0.65)
    );
  }

  /* SCUSA BASE – situazione quotidiana */
  .card-media-base {
    background-image: url("https://images.unsplash.com/photo-1528605248644-14dd04022da1?auto=format&fit=crop&w=1200&q=80");
  }

  /* SCUSA PREMIUM – tono curato, empatico */
  .card-media-premium {
    background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1200&q=80");
  }

  /* SCUSA BUSINESS – contesto professionale */
  .card-media-business {
    background-image: url("https://images.unsplash.com/photo-1523958203904-cdcb402031fd?auto=format&fit=crop&w=1200&q=80");
  }

  /* SCUSA DIVERTENTE – ironia, leggerezza */
  .card-media-fun {
    background-image: url("https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=1200&q=80");
  }

  /* ========= CONTENUTO CARD ========= */

  .card-content {
    padding: 18px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .badge {
    align-self: flex-start;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(124,58,237,.2);
    border: 1px solid rgba(124,58,237,.4);
  }

  .price {
    font-size: 22px;
    font-weight: 700;
    margin-top: auto;
  }

  .btn {
    margin-top: 14px;
    padding: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #7c3aed;
    color: white;
    font-weight: 700;
    transition: background .2s ease;
  }

  .btn:hover {
    background: #6d28d9;
  }
</style>
